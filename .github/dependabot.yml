# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Standardized across all SilverAssist WordPress plugins — see paubox-cf7 for
# the reference copy. Only patch/minor updates are grouped for auto-merge;
# majors always get their own PR for manual review.

version: 2

# Private SilverAssist Composer packages are `vcs` repositories on GitHub.
# Once those repositories are private (WEB-1194), Dependabot needs a token to
# read them. COMPOSER_GITHUB_TOKEN is a Dependabot secret holding a token with
# read access to the SilverAssist repositories.
registries:
  silverassist-github:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.COMPOSER_GITHUB_TOKEN}}

updates:
  # Composer dependencies (PHP packages)
  - package-ecosystem: "composer"
    directory: "/"
    registries:
      - silverassist-github
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "composer"
      - "automated"
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
      include: "scope"
    groups:
      composer-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # PHPUnit 10+ incompatible with WordPress Test Suite (WP_UnitTestCase);
      # the test suite still requires PHPUnit 9.x.
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]
      # Internal SilverAssist packages — major bumps get manual review.
      - dependency-name: "silverassist/wp-settings-hub"
        update-types: ["version-update:semver-major"]
      - dependency-name: "silverassist/wp-github-updater"
        update-types: ["version-update:semver-major"]
      - dependency-name: "silverassist/wp-plugin-kernel"
        update-types: ["version-update:semver-major"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
